basePath: /api/v1
definitions:
  model.ErrorResponse:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  model.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        description: detik
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  model.WebResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/model.Meta'
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    API pendaftaran kelas (KRS), ulasan kelas, dan notifikasi.
    Seluruh endpoint selain /auth memerlukan access token.
  title: API KRS Praktikum Backend Lanjut
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Dibatasi 5 kali gagal per menit per IP.
      parameters:
      - description: Username dan password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/model.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.TokenPair'
              type: object
        "401":
          description: Username atau password salah
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "429":
          description: Terlalu banyak percobaan login
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Login dan mendapatkan pasangan token
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'Isi dengan: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
